syntax = "proto3";

package gnmi_ext;

option go_package = "github.com/openconfig/gnmi/proto/gnmi_ext";

// The Extension message contains a single gNMI extension.
message Extension {
  oneof ext {
    RegisteredExtension registered_ext = 1;
    MasterArbitration master_arbitration = 2;
    History history = 3;
  }
}

// The RegisteredExtension message defines an extension which is defined outside
// of this file.
message RegisteredExtension {
  ExtensionID id = 1;
  bytes msg = 2;
}

enum ExtensionID {
  EID_UNSET = 0;
  EID_EXPERIMENTAL = 999;
}

// MasterArbitration is used to select the master among multiple gNMI clients
// with the same Roles.
message MasterArbitration {
  Role role = 1;
  Uint128 election_id = 2;
}

message Uint128 {
  uint64 high = 1;
  uint64 low = 2;
}

message Role {
  string id = 1;
}

message History {
  oneof request {
    int64 snapshot_time = 1;
    TimeRange range = 2;
  }
}

message TimeRange {
  int64 start = 1;
  int64 end = 2;
}
