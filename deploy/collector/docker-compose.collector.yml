version: '3.8'

services:
  init-volume:
    image: busybox:1.36
    container_name: netspout-flow-init
    command: ["sh", "-c", "chmod 777 /flows && touch /flows/flows.json && chmod 666 /flows/flows.json"]
    volumes:
      - netspout_flow_data:/flows
    restart: "no"

  netspout-flow-collector:
    image: netsampler/goflow2:v2.2.5@sha256:780f95c076bd3eb94d578d3f11c93ad289997edebdd8e48c9ce4801d160f238a
    user: "100:65533"
    container_name: netspout-flow-collector
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - -listen
      - netflow://:2055,netflow://:4739
      - -format
      - json
      - -transport
      - file
      - -transport.file
      - /flows/flows.json
    ports:
      - "127.0.0.1:2055:2055/udp"
      - "127.0.0.1:4739:4739/udp"
      - "127.0.0.1:8080:8080"
    volumes:
      - netspout_flow_data:/flows
    depends_on:
      init-volume:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/store"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  netspout-flow-forwarder:
    build:
      context: .
      dockerfile: Dockerfile.forwarder
    user: "10001:10001"
    container_name: netspout-flow-forwarder
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - SPLUNK_HEC_URL=https://host.docker.internal:8888/services/collector/event
      - SPLUNK_HEC_TOKEN_FILE=/run/secrets/splunk-inputs.conf
      - SPLUNK_INDEX=idx_network_ops
      - SPLUNK_SOURCETYPE=netflow:collector
      - FLOW_FILE=/flows/flows.json
      - STATUS_PORT=8082
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - netspout_flow_data:/flows
      - ../../docker/standalone/inputs.conf:/run/secrets/splunk-inputs.conf:ro
    depends_on:
      init-volume:
        condition: service_completed_successfully
      netspout-flow-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  netspout_flow_data:
    name: netspout_flow_data
