version: '3.8'

services:
  # =========================================================================
  # NetSpout Standalone: All-In-One Container (Splunk Enterprise + NetSpout App + Fast Sim Backend)
  # =========================================================================
  splunk-netspout:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.standalone
    container_name: splunk-netspout-standalone
    hostname: splunk-netspout
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD before starting NetSpout}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN before starting NetSpout}
      - SPLUNK_HEC_PORT=8088
      - SPLUNK_ROLE=splunk_standalone
      - FAST_SIMULATION_PORT=8081
      - SPLUNK_HEC_URL=https://splunk-netspout:8088/services/collector
      - NETSPOUT_HEC_TOKEN=${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN before starting NetSpout}
      - NETSPOUT_REST_SEARCH_URL=https://splunk-netspout:8089/services/search/jobs/export
      - NETSPOUT_SPLUNK_USER=admin
      - NETSPOUT_SPLUNK_PASSWORD=${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD before starting NetSpout}
      - OTEL_ENDPOINT=http://otel-collector:4318
      - NETSPOUT_STUDIO_DIR=/opt/splunk/var/lib/netspout/studio
      - NETSPOUT_CONFIG_DIR=/opt/splunk/var/lib/netspout/config
    ports:
      - "127.0.0.1:8000:8000" # Splunk Web UI
      - "127.0.0.1:8088:8088" # Splunk HEC
      - "127.0.0.1:8089:8089" # Splunk Management REST API
      - "127.0.0.1:8081:8081" # Local-only Studio, simulation REST, and WebSocket API
      - "127.0.0.1:514:514/udp" # Local lab Syslog UDP
      - "127.0.0.1:514:514/tcp" # Local lab Syslog TCP
    volumes:
      - splunk_data:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc
    healthcheck:
      test: ["CMD-SHELL", "curl -fkSs https://localhost:8088/services/collector/health | grep -q '\"text\":\"HEC is healthy\"' && curl -fSs http://localhost:8081/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks:
      - netspout-net

  # =========================================================================
  # OpenTelemetry Collector (Contrib) - Optional Universal Receiver & Pipeline
  # =========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0@sha256:7ef2a2ff46b9e432321fdd63df104bfeedaf7b4e276950f42c634d0f23521fc4
    container_name: netspout-otel-collector
    hostname: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN before starting NetSpout}
    volumes:
      - ./otel-collector-config.standalone.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # Local lab OTLP gRPC receiver
      - "127.0.0.1:4318:4318" # Local lab OTLP HTTP receiver
      - "127.0.0.1:8889:8889" # Local lab Prometheus metrics exporter
    depends_on:
      - splunk-netspout
    restart: unless-stopped
    networks:
      - netspout-net

networks:
  netspout-net:
    driver: bridge

volumes:
  splunk_data:
    name: netspout_splunk_data
  splunk_etc:
    name: netspout_splunk_etc
