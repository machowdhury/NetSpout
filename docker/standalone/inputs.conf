# HEC is rendered into local/inputs.conf by entrypoint-standalone.sh from the
# required SPLUNK_HEC_TOKEN environment secret.
[udp://514]
connection_host = dns
index = idx_network_ops
sourcetype = syslog
no_priority_stripping = true

[tcp://514]
connection_host = dns
index = idx_network_ops
sourcetype = syslog

