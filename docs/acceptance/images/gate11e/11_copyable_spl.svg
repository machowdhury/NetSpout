  <text x="40" y="140" fill="#94a3b8" font-size="14" font-family="monospace">Raw Events SPL:</text><text x="260" y="140" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">search index=idx_network_ops sourcetype=netflow:collector ...</text><text x="40" y="168" fill="#94a3b8" font-size="14" font-family="monospace">Stats Aggregation SPL:</text><text x="260" y="168" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">| stats count as total_flows sum(Bytes) by SrcAddr DstAddr</text><text x="40" y="196" fill="#94a3b8" font-size="14" font-family="monospace">CIM Field Compliance:</text><text x="260" y="196" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">src_addr, dst_addr, src_port, dst_port, proto</text><text x="40" y="224" fill="#94a3b8" font-size="14" font-family="monospace">Investigation Usability:</text><text x="260" y="224" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">Ready for Top Talkers & Port Analysis</text><text x="40" y="252" fill="#94a3b8" font-size="14" font-family="monospace">Copy Button in UI:</text><text x="260" y="252" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">Supported via Companion Manifest</text>
</svg>