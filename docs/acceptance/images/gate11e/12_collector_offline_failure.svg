<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="60" rx="12" fill="#1e293b"/>
  <text x="30" y="38" fill="#38bdf8" font-size="20" font-weight="bold" font-family="system-ui, sans-serif">Failure Scenario A — Collector Offline</text>
  <rect x="520" y="16" width="160" height="28" rx="6" fill="#3b82f6"/>
  <text x="600" y="35" fill="#ffffff" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">NATIVE TRANSPORT</text>
  <rect x="690" y="16" width="80" height="28" rx="6" fill="#10b981"/>
  <text x="730" y="35" fill="#ffffff" font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle">PASS</text>
  <text x="30" y="95" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">NetSpout truthfully refuses delivery confirmation when collector is down</text>
  <line x1="30" y1="110" x2="770" y2="110" stroke="#334155" stroke-width="1"/>
  <text x="40" y="140" fill="#94a3b8" font-size="14" font-family="monospace">UDP Socket sendto:</text><text x="260" y="140" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">PASS (Local OS socket transmit succeeds)</text><text x="40" y="168" fill="#94a3b8" font-size="14" font-family="monospace">Collector Observed:</text><text x="260" y="168" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">FAIL (No GoFlow2 listener on port)</text><text x="40" y="196" fill="#94a3b8" font-size="14" font-family="monospace">Splunk Observed:</text><text x="260" y="196" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">FAIL (Zero events indexed in Splunk)</text><text x="40" y="224" fill="#94a3b8" font-size="14" font-family="monospace">Delivery Status:</text><text x="260" y="224" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">FAIL (Truthful, 0 False Claims)</text><text x="40" y="252" fill="#94a3b8" font-size="14" font-family="monospace">Actionable Guidance:</text><text x="260" y="252" fill="#f8fafc" font-size="14" font-family="monospace" font-weight="bold">Check collector listener and container health</text>
</svg>