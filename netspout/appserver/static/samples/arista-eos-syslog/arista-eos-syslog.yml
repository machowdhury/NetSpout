samples:
  - name: arista-eos-syslog
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%3NZ"
    lines:
      - index: netops_logs
        source: syslog:udp:514
        sourcetype: arista:eos:syslog
        host: "sensor-01.acme.corp"
        _raw: 'May 20 14:00:15 switch-leaf-01.acme.local Ebra: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet22, changed state to down'
      - index: netops_logs
        source: syslog:udp:514
        sourcetype: arista:eos:syslog
        host: "sensor-01.acme.corp"
        _raw: 'May 20 14:00:17 switch-leaf-01.acme.local Ebra: %LINEPROTO-5-UPDOWN: Line protocol on Interface Ethernet22, changed state to up'
