        source: arista_eos_syslog
        sourcetype: arista:eos
        _raw: "May 20 14:00:06 sw-arista-7280-01 Thermostat: %ENVIRONMENT-6-TEMP_NORMAL: Chassis temperature normalized to 42 C"
