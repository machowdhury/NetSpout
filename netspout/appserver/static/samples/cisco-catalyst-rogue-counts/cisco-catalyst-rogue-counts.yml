samples:
- name: cisco-catalyst-rogue-counts
  description: Real Network Assurance replay for cisco:catalyst:rogue:counts (catalyst index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: catalyst
      sourcetype: cisco:catalyst:rogue:counts
      source: http:rougue
      host: 3.128.0.44:8088
      _time: "$EPOCH$"
      _raw: '26'
    - index: catalyst
      sourcetype: cisco:catalyst:rogue:counts
      source: http:rougue
      host: 3.128.0.44:8088
      _time: "$EPOCH$"
      _raw: '21'
