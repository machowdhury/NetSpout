samples:
- name: cisco-catalyst-threat-signatures
  description: Real Network Assurance replay for cisco:catalyst:threat:signatures (catalyst index)
  interval: 60
  count: 1
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: catalyst
      sourcetype: cisco:catalyst:threat:signatures
      source: http:rougue
      host: 3.128.0.44:8088
      _time: "$EPOCH$"
      _raw: '{"status": "success", "msg": "API returned empty list / no active data"}'
