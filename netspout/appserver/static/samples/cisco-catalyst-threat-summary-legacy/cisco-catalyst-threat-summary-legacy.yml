samples:
- name: cisco-catalyst-threat-summary-legacy
  description: Real Network Assurance replay for cisco:catalyst:threat:summary:legacy (catalyst index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: catalyst
      sourcetype: cisco:catalyst:threat:summary:legacy
      source: http:rougue
      host: 3.128.0.44:8088
      _time: "$EPOCH$"
      _raw: '{"timestamp": $EPOCH_MS$, "threatData": [{"threatType": "mapleRule2", "threatLevel": "High", "threatCount": 17, "threatTypeInt": "18001"}, {"threatType": "Neighbor", "threatLevel": "Informational", "threatCount": 3, "threatTypeInt": "1901"}, {"threatType": "rougeRule", "threatLevel": "High", "threatCount": 2, "threatTypeInt": "18000"}, {"threatType": "Interferer", "threatLevel": "Potential", "threatCount": 1, "threatTypeInt": "5001"}]}'
    - index: catalyst
      sourcetype: cisco:catalyst:threat:summary:legacy
      source: http:rougue
      host: 3.128.0.44:8088
      _time: "$EPOCH$"
      _raw: '{"timestamp": $EPOCH_MS$, "threatData": [{"threatType": "mapleRule2", "threatLevel": "High", "threatCount": 21, "threatTypeInt": "18001"}, {"threatType": "rougeRule", "threatLevel": "High", "threatCount": 2, "threatTypeInt": "18000"}, {"threatType": "Neighbor", "threatLevel": "Informational", "threatCount": 4, "threatTypeInt": "1901"}, {"threatType": "Interferer", "threatLevel": "Potential", "threatCount": 1, "threatTypeInt": "5001"}]}'
