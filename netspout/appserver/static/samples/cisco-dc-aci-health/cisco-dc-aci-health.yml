samples:
- name: cisco-dc-aci-health
  description: Real Network Assurance replay for cisco:dc:aci:health (main index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: main
      sourcetype: cisco:dc:aci:health
      source: apic:health
      host: apic-inb.maple.ciscolabs.com
      _time: "$EPOCH$"
      _raw: '$GOTS$	childClassName1=eqptLCSlot	childDn1=topology/pod-1/node-103/sys/ch/lcslot-1	chng=3	criticalImpact=0	cur=66	dn=topology/pod-1/node-103/sys/ch/health	majorImpact=0	maxSev=cleared	minorImpact=0	prev=64	twScore=66	updTs=$GOTS$	warnImpact=0	descr=Nexus C93180YC-FX chassis	model=N9K-C93180YC-FX	operSt=online	role=leaf	ser=FDO223526K5	apic_host=apic-inb.maple.ciscolabs.com	component=eqptCh'
    - index: main
      sourcetype: cisco:dc:aci:health
      source: apic:health
      host: apic-inb.maple.ciscolabs.com
      _time: "$EPOCH$"
      _raw: '$GOTS$	bootSource=bootflash	configRole=unspecified	descr=Nexus C93180YC-FX chassis	dn=topology/pod-1/node-104/sys/ch	hybridMode=no	id=1	model=N9K-C93180YC-FX	operSt=online	role=leaf	ser=FDO22352N94	apic_host=apic-inb.maple.ciscolabs.com	component=eqptCh'
