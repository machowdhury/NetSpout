samples:
  ### CISCO-DUO-ACTIVITY - HEALTHY BASELINE ###
  - name: cisco-duo-activity-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: splunkhf.maple.ciscolabs.com
          - weight: 2
            choice: splunkhf.maple.ciscolabs.com-peer
    lines:
      - index: cisco_duo
        source: sbg_duo_input://MAPLE_DUO
        sourcetype: cisco:duo:activity
        host: $HOST$
        _raw: '{"ctime": "Fri $SYSLOG_TIMESTAMP$ 2026", "access_device": null, "action": {"details": "{\"sync_ref_code\": \"951940ce7e0bcc4150b1fde70fd0988c\", \"duration\": \"0:00:07\", \"selected_groups\": [\"cn=lab_owners,ou=maple_groups,dc=maple,dc=ciscolabs,dc=com\", \"cn=subrosa_users,ou=maple_groups,dc=maple,dc=ciscolabs,dc=com\", \"cn=maple-vpn-users,ou=maple_groups,dc=maple,dc=ciscolabs,dc=com\", \"cn=cisco_rdp_dng,ou=maple_groups,dc=maple,dc=ciscolabs,dc=com\", \"cn=cisco_users,ou=maple_groups,dc=maple,dc=ciscolabs,dc=com\"]}", "name": "ad_sync_finish"}, "activity_id": "384adfdb-96ab-46c6-9745-b86407048ab7", "actor": {"details": "{\"created\": null, \"last_login\": null, \"email\": null, \"status\": null, \"groups\": null, \"role\": null}", "key": null, "name": "Active Directory User Sync: AD MAPLE", "type": "ldap_sync"}, "akey": "DAOSZ4YYK0VOGIA1JIYJ", "application": null, "old_target": null, "outcome": {"result": "SUCCESS"}, "target": {"details": "{\"ldname\": \"AD MAPLE\", \"sync_phones\": true, \"send_enrollment\": false, \"username_attribute\": \"samaccountname\", \"realname_attribute\": \"displayname\", \"phone1_attribute\": \"telephonenumber\", \"phone2_attribute\": \"mobile\", \"email_attribute\": \"mail\", \"notes_attribute\": null, \"directory_type\": \"activedirectory\", \"connection\": {\"ldap_conn_name\": null, \"ldap_conn_key\": null, \"base_dn\": null, \"ntlm_domain\": null, \"ntlm_workstation\": null, \"ssl_verify_hostname\": null, \"used_by_user_syncs\": null, \"used_by_admin_syncs\": null}, \"group_change_desc\": null, \"groups\": null, \"authproxy_identifiers\": null}", "key": "DS2ACAGGQBNC95H3U4QS", "name": "AD MAPLE", "type": "ldap_directory"}, "ts": "$ISO_TIMESTAMP$", "timestamp": 1789752192, "host": "api-dd716ff8.duosecurity.com", "extracted_eventtype": "activity"}'

