        sourcetype: cisco:duo:authentication
        host: MAHAMUDC-M-XW40$
        _raw: '{"timestamp": $, "isotimestamp": "$", "username": "guest.contractor@corp.internal", "user": {"key": "DU19284109", "name": "guest.contractor@corp.internal"}, "factor": "Passcode", "result": "FAILURE", "reason": "Invalid passcode / user locked out after 3 failed attempts", "integration": "Office 365 SAML SSO", "ip": "203.0.113.19", "location": {"city": "Frankfurt", "state": "Hesse", "country": "DE"}, "access_device": {"ip": "203.0.113.19", "location": {"city": "Frankfurt", "state": "Hesse", "country": "DE"}, "browser": "Edge", "browser_version": "127.0", "os": "Windows", "os_version": "11", "trusted_endpoint_status": "unknown"}, "host": "api-dd716ff8.duosecurity.com", "extracted_eventtype": "authentication"}'
