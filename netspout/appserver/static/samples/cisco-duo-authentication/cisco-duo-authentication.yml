        _raw: '{"timestamp": $, "isotimestamp": "$", "username": "alex.turner@corp.internal", "user": {"key": "DU19284102", "name": "alex.turner@corp.internal"}, "factor": "Duo Push", "result": "DENIED", "reason": "Impossible travel velocity anomaly: Austin (US) to Moscow (RU) in 8 minutes", "integration": "Splunk Production Enterprise NOC", "ip": "185.220.101.4", "location": {"city": "Moscow", "state": "Moscow", "country": "RU"}, "access_device": {"ip": "185.220.101.4", "location": {"city": "Moscow", "state": "Moscow", "country": "RU"}, "browser": "Firefox", "browser_version": "129.0", "os": "Linux", "os_version": "Ubuntu 22.04", "trusted_endpoint_status": "untrusted"}, "host": "api-dd716ff8.duosecurity.com", "extracted_eventtype": "authentication"}'
