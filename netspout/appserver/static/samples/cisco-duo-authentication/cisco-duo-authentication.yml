samples:
  ### CISCO-DUO-AUTHENTICATION - HEALTHY BASELINE (SUCCESS) ###
  - name: cisco-duo-authentication-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: splunkhf.maple.ciscolabs.com
          - weight: 2
            choice: splunkhf.maple.ciscolabs.com-peer
    lines:
      - index: cisco_duo
        source: sbg_duo_input://MAPLE_DUO
        sourcetype: cisco:duo:authentication
        host: MAHAMUDC-M-XW40$
        _raw: '{"timestamp": $, "isotimestamp": "$", "username": "machowdhury@yahoo.com", "user": {"key": "DU19284101", "name": "machowdhury@yahoo.com"}, "factor": "Duo Push", "result": "SUCCESS", "reason": "User approved", "integration": "Cisco AnyConnect SSL-VPN", "ip": "198.51.100.42", "location": {"city": "San Jose", "state": "California", "country": "US"}, "access_device": {"ip": "198.51.100.42", "location": {"city": "San Jose", "state": "California", "country": "US"}, "browser": "Safari", "browser_version": "17.4", "os": "macOS", "os_version": "14.4", "trusted_endpoint_status": "trusted"}, "auth_device": {"name": "iPhone 15 Pro", "ip": "198.51.100.42", "location": {"city": "San Jose", "state": "California", "country": "US"}}, "host": "api-dd716ff8.duosecurity.com", "extracted_eventtype": "authentication"}'

  ### CISCO-DUO-AUTHENTICATION - FRAUD ALERT (USER REPORTED) ###
  - name: cisco-duo-authentication-fraud
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: splunkhf.maple.ciscolabs.com
    lines:
      - index: cisco_duo
        source: sbg_duo_input://MAPLE_DUO
        sourcetype: cisco:duo:authentication
        host: MAHAMUDC-M-XW40$
        _raw: '{"timestamp": $, "isotimestamp": "$", "username": "alex.turner@corp.internal", "user": {"key": "DU19284102", "name": "alex.turner@corp.internal"}, "factor": "Duo Push", "result": "FRAUD", "reason": "User reported fraud during push prompt", "integration": "Cisco AnyConnect SSL-VPN", "ip": "194.28.172.5", "location": {"city": "Kyiv", "state": "Kyiv City", "country": "UA"}, "access_device": {"ip": "194.28.172.5", "location": {"city": "Kyiv", "state": "Kyiv City", "country": "UA"}, "browser": "Chrome", "browser_version": "128.0", "os": "Android", "os_version": "14", "trusted_endpoint_status": "untrusted"}, "auth_device": {"name": "iPhone 15 Pro", "ip": "198.51.100.88", "location": {"city": "Austin", "state": "Texas", "country": "US"}}, "host": "api-dd716ff8.duosecurity.com", "extracted_eventtype": "authentication"}'

  ### CISCO-DUO-AUTHENTICATION - POLICY DENIAL & IMPOSSIBLE TRAVEL ###
