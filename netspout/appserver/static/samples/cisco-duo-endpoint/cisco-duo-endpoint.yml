samples:
  - name: cisco-duo-endpoint-baseline
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
    lines:
      - index: idx_security_fw
        source: rest:duo
        sourcetype: cisco:duo:endpoint:posture
        host: duo-api.corp.internal
        _raw: "{\"timestamp\":$EPOCH$,\"iso_timestamp\":\"$ISO_TIMESTAMP$\",\"event_type\":\"endpoint_health\",\"device\":{\"os\":\"macOS\",\"os_version\":\"15.3.1\",\"model\":\"MacBookPro18,1\",\"encryption\":{\"disk\":\"FileVault_Encrypted\",\"status\":\"HEALTHY\"},\"security_software\":{\"edr\":\"CrowdStrike Falcon 7.14\",\"firewall_active\":true,\"screen_lock_enforced\":true},\"jailbroken\":false},\"user\":\"m.chowdhury@corp.internal\",\"posture_result\":\"COMPLIANT\",\"trusted_endpoint\":true}"
      - index: idx_security_fw
        source: rest:duo
        sourcetype: cisco:duo:endpoint:posture
        host: duo-api.corp.internal
        _raw: "{\"timestamp\":$EPOCH$,\"iso_timestamp\":\"$ISO_TIMESTAMP$\",\"event_type\":\"endpoint_health\",\"device\":{\"os\":\"Windows\",\"os_version\":\"11_23H2\",\"model\":\"Dell Latitude 5530\",\"encryption\":{\"disk\":\"Unencrypted\",\"status\":\"NON_COMPLIANT\"},\"security_software\":{\"firewall_active\":false}},\"user\":\"contractor_dave@corp.internal\",\"posture_result\":\"BLOCKED\",\"remediation_url\":\"https://help.corp.internal/duo-posture-fix\"}"
