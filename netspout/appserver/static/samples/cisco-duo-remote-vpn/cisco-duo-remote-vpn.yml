samples:
  - name: cisco-duo-remote-vpn-baseline
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
    lines:
      - index: idx_security_fw
        source: rest:duo
        sourcetype: cisco:duo:remote:vpn
