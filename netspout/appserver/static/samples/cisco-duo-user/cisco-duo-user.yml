  ### CISCO-DUO-USER - HEALTHY BASELINE ###
  - name: cisco-duo-user-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: splunkhf.maple.ciscolabs.com
          - weight: 2
            choice: splunkhf.maple.ciscolabs.com-peer
    lines:
      - index: cisco_duo
        source: sbg_duo_input://MAPLE_DUO
        sourcetype: cisco:duo:user
        host: $HOST$
