  ### CISCO-INTERSIGHT-ADVISORIES - HEALTHY BASELINE ###
  - name: cisco-intersight-advisories-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: splunkhf.maple.ciscolabs.com
          - weight: 2
            choice: splunkhf.maple.ciscolabs.com-peer
    lines:
      - index: main
        source: tamAdvisoryDefinition
        sourcetype: cisco:intersight:advisories
        host: $HOST$
        _raw: '{"AccountMoid": "5960901ca94eba000127e33a", "Actions": [{"AffectedObjectType": "equipment.Chassis", "AlertType": "eolAdvisory", "Identifiers": [{"Name": "Moid", "ObjectType": "tam.Identifiers", "Value": "ds1_Moid"}], "Name": "", "ObjectType": "tam.Action", "OperationType": "create", "Queries": [{"Name": "qds2", "ObjectType": "tam.QueryEntry", "Priority": 1, "Query": "SELECT * FROM ds1 where ( datediff(current_date(), ''2030-02-28'' ) >= -90 and datediff(current_date(), ''2030-02-28'' ) < 0 )"}], "Type": "restApi"}], "AdvisoryDetails": {"AllMilestones": [{"Date": "$ISO_TIMESTAMP$", "Description": "The last date to receive applicable service and support for the product as entitled by active service contracts or by warranty terms and conditions. After this date, all support services for the product are unavailable, and the product becomes obsolete.", "EndOffset": 2147483647, "LabelHint": "upcoming", "MilestoneType": "unknown", "Name": "Last Date of (Hardware) Support", "ObjectType": "tam.Milestone", "StartOffset": 0}], "Description": "", "Milestone": {"Date": "$ISO_TIMESTAMP$", "Description": "The last date to receive applicable service and support for the product as entitled by active service contracts or by warranty terms and conditions. After this date, all support services for the product are unavailable, and the product becomes obsolete.", "EndOffset": 0, "LabelHint": "imminent", "MilestoneType": "lastDateOfSupport", "Name": "Last Date Of Support(LDOS) Date", "ObjectType": "tam.Milestone", "StartOffset": -90}, "ObjectType": "tam.EolAdvisoryDetails", "Release": "UCSB-5108-HVDC"}, "AdvisoryId": "ucsb-5108-dc-ldos-medium", "Ancestors": [], "ApiDataSources": [{"MoType": "equipmentChassis", "Name": "ds1", "ObjectType": "tam.ApiDataSource", "Queries": [{"Name": "qds1", "ObjectType": "tam.QueryEntry", "Priority": 1, "Query": "SELECT ds1_Moid, ds1_AccountMoid, ds1_DomainGroupMoid, ds1_RegisteredDevice.Moid as ds1_RegisteredDeviceMoid, ds1_Model, ds1_ManagementMode FROM ds1 WHERE ds1_Model RLIKE ''(UCSB-5108-HVDC|UCSB-5108-DC2)''"}], "Type": "intersightApi"}], "CreateTime": "$ISO_TIMESTAMP$", "DatePublished": "$ISO_TIMESTAMP$", "DateUpdated": "$ISO_TIMESTAMP$", "Description": "Cisco announced the end-of-sale and end-of-life dates for the Cisco 5108 DC and HVDC Chassis. The last date of (hardware) support for the affected product(s) is February 28, 2030. Customers with active service contracts will continue to receive support from the Cisco Technical Assistance Center (TAC) based on EoL bulletin.", "DomainGroupMoid": "5b2541877a7662743465cc89", "ExecuteOnPod": "tier1", "ExternalUrl": "https://www.cisco.com/c/en/us/products/collateral/servers-unified-computing/ucs-b-series-blade-servers/5108-dc-hvdc-chassis-eol.html", "ModTime": "$ISO_TIMESTAMP$", "Moid": "68250f936f636b3901fcbc44", "Name": "Last Date of Support for the Cisco 5108 DC and HVDC Chassis is imminent", "ObjectType": "tam.AdvisoryDefinition", "Organization": {"Moid": "5dde9f896972652d3353a082", "ObjectType": "organization.Organization", "link": "https://intersight.com/api/v1/organization/Organizations/5dde9f896972652d3353a082"}, "OtherRefUrls": [], "Owners": ["5960901ca94eba000127e33a", "shared"], "PermissionResources": [{"Moid": "5dde9f896972652d3353a082", "ObjectType": "organization.Organization", "link": "https://intersight.com/api/v1/organization/Organizations/5dde9f896972652d3353a082"}], "Recommendation": "There is no replacement available for the Cisco 5108 DC and HVDC Chassis at this time.\n\nCustomers may be able to use the Cisco Technology Migration Program (TMP) where applicable to trade-in eligible products and receive credit toward the purchase of new Cisco equipment. For more information about Cisco TMP, customers should work with their Cisco Partner or Cisco account team. Cisco Partners can find additional TMP information on Partner Central at: [https://www.cisco.com/web/partners/incentives_and_promotions/tmp.html](https://www.cisco.com/web/partners/incentives_and_promotions/tmp.html).\n\nCustomers may be able to continue to purchase the Cisco 5108 DC and HVDC Chassis through the Cisco Certified Refurbished Equipment program. Refurbished units may be available in limited supply for sale in certain countries on a first-come, first-served basis until the Last Date of Support has been reached. For information about the Cisco Certified Refurbished Equipment program, go to: [https://www.cisco.com/go/eos](https://www.cisco.com/go/eos).\n\nThe Cisco Takeback and Recycle program helps businesses properly dispose of surplus products that have reached their end of useful life. The program is open to all business users of Cisco equipment and its associated brands and subsidiaries. For more information, go to: [https://www.cisco.com/web/about/ac227/ac228/ac231/about_cisco_takeback_recycling.html](https://www.cisco.com/web/about/ac227/ac228/ac231/about_cisco_takeback_recycling.html).\n\nFor more information about the Cisco End-of-Life Policy, go to: [https://www.cisco.com/c/en/us/products/eos-eol-policy.html](https://www.cisco.com/c/en/us/products/eos-eol-policy.html).\n\nFor more information about the Cisco Product Warranties, go to: [https://www.cisco.com/c/en/us/products/warranty-listing.html](https://www.cisco.com/c/en/us/products/warranty-listing.html).\n\nTo subscribe to receive end-of-life/end-of-sale information, go to: [https://cway.cisco.com/mynotifications](https://cway.cisco.com/mynotifications).", "S3DataSources": [], "Severity": {"Level": "info", "ObjectType": "tam.EolSeverity"}, "SharedScope": "shared", "State": "ready", "Tags": [], "Type": "eolAdvisory", "Version": "1.0", "Workaround": "", "account_name": "MAPLE", "updated_at": "$ISO_TIMESTAMP$"}'

