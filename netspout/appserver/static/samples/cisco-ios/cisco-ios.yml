samples:
- name: cisco-ios
  description: Real Network Assurance replay for cisco:ios (main index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: main
      sourcetype: cisco:ios
      source: udp:5515
      host: 10.0.0.252
      _time: "$EPOCH$"
      _raw: '$TS$ 10.0.0.253 : 2026 Feb 28 19:00:01 EST: %OSPF-4-DUPRID:  ospf-10 [32135] (default) Router 10.0.10.2 on interface Vlan810 is using our routerid, packet dropped'
    - index: main
      sourcetype: cisco:ios
      source: udp:5515
      host: 10.0.0.252
      _time: "$EPOCH$"
      _raw: '$TS$ 10.0.0.252 OTT-CORE01: 2026 Mar 26 11:40:56 EST: %ICMPV6-3-ND_RA_LOG:  icmpv6 [19462]  fe80::232:17ff:fe3c:ac58 on Vlan503 Current-hop-limit:64, m-bit:0, o-bit:0, rtr-lifetime:1800, reachable-time:0, retrans-timer:0 '
