samples:
  - name: cisco-ise-nac-8021x-baseline
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
    lines:
      - index: idx_network_ops
        source: udp:514
        sourcetype: cisco:ise:nac:8021x
        host: ise-pan01.corp.internal
        _raw: "$SYSLOG_TIMESTAMP$ ise-pan01.corp.internal CISE_Passed_Authentications 0001847295 1 0 $ISO_TIMESTAMP$ +00:00 0029481925 5200 NOTICE Passed-Authentication: Authentication succeeded, ConfigVersionId=127, Device IP Address=10.254.8.1, DestinationIPAddress=10.254.1.50, DestinationPort=1812, UserName=corp\\\\alice.sec, Protocol=Radius, NAS-IP-Address=10.254.8.1, NAS-Port-Id=GigabitEthernet1/0/24, Framed-IP-Address=10.20.10.45, Tunnel-Private-Group-Id=(tag=1) 20, Tunnel-Type=(tag=1) 13, Tunnel-Medium-Type=(tag=1) 6, EapAuthentication=EAP-TLS, IdentityGroup=SecOps_Endpoints, SelectedAuthorizationProfiles=TrustSec_SecOps_Permit"
      - index: idx_network_ops
        source: udp:514
        sourcetype: cisco:ise:nac:8021x
        host: ise-pan01.corp.internal
        _raw: "$SYSLOG_TIMESTAMP$ ise-pan01.corp.internal CISE_Failed_Attempts 0001847296 1 0 $ISO_TIMESTAMP$ +00:00 0029481926 5400 NOTICE Failed-Attempt: 802.1X Authentication Failed, ConfigVersionId=127, Device IP Address=10.254.8.1, DestinationPort=1812, UserName=corp\\\\unknown_mac, FailureReason=22040 Wrong password or invalid certificate, EapAuthentication=PEAP"
