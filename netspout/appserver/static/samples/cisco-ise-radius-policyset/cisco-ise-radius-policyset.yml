samples:
  ### CISCO-ISE-RADIUS-POLICYSET - HEALTHY BASELINE ###
  - name: cisco-ise-radius-policyset-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: https://10.0.10.34
          - weight: 2
            choice: https://10.0.10.34-peer
    lines:
      - index: main
        source: cisco_catalyst_ise_administrative_input:AUTH_POLICY:ISE02
        sourcetype: cisco:ise:radius:policyset
        host: $HOST$
        _raw: '{"default": true, "id": "f26b5958-d128-4f4b-9e17-d0338af2b891", "name": "Default", "description": "Default policy set", "hitCounts": 238844, "rank": 0, "state": "enabled", "condition": null, "serviceName": "Default Network Access", "isProxy": false, "link": {"rel": "self", "href": "$HOST$/api/v1/policy/network-access/policy-set/f26b5958-d128-4f4b-9e17-d0338af2b891", "type": "application/json"}, "lastUpdated": 1784258516483}'

