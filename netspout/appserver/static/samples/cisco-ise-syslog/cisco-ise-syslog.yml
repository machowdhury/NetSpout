samples:
  ### CISCO-ISE-SYSLOG - HEALTHY BASELINE ###
  - name: cisco-ise-syslog-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISE_TIMESTAMP
        format: template
        type: gotimestamp
        replacement: "2006-01-02 15:04:05.000 -07:00"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: gotimestamp
        replacement: "Jan 02 15:04:05"
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 1
            choice: ise-lab-01
    lines:
      - index: main
        source: udp:5516
        sourcetype: cisco:ise:syslog
        host: ise-lab-01
        _raw: "<181>$SYSLOG_TIMESTAMP$ $HOST$ CISE_Passed_Authentications 0000000001 1 0 $ISE_TIMESTAMP$ 0000000001 5200 NOTICE Passed-Authentication: Authentication succeeded, User-Name=lab_user, Calling-Station-ID=02:00:00:00:00:01, Framed-IP-Address=192.0.2.30, NAS-IP-Address=192.0.2.20, Protocol=Radius, Response={RadiusPacketType=AccessAccept;}"

  ### CISCO-ISE-SYSLOG - DEGRADED / WARNING ###
  - name: cisco-ise-syslog-degraded
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISE_TIMESTAMP
        format: template
        type: gotimestamp
        replacement: "2006-01-02 15:04:05.000 -07:00"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: gotimestamp
        replacement: "Jan 02 15:04:05"
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 1
            choice: ise-lab-01
    lines:
      - index: main
        source: udp:5516
        sourcetype: cisco:ise:syslog
        host: ise-lab-01
        _raw: "<181>$SYSLOG_TIMESTAMP$ $HOST$ CISE_Failed_Attempts 0000000002 1 0 $ISE_TIMESTAMP$ 0000000002 5400 NOTICE Failed-Attempt: Authentication failed, User-Name=lab_user, Calling-Station-ID=02:00:00:00:00:01, Framed-IP-Address=192.0.2.30, NAS-IP-Address=192.0.2.20, Protocol=Radius, Response={RadiusPacketType=AccessReject;}"

  ### CISCO-ISE-SYSLOG - CRITICAL / FAILURE ###
  - name: cisco-ise-syslog-failure
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISE_TIMESTAMP
        format: template
        type: gotimestamp
        replacement: "2006-01-02 15:04:05.000 -07:00"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: gotimestamp
        replacement: "Jan 02 15:04:05"
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 1
            choice: ise-lab-01
    lines:
      - index: main
        source: udp:5516
        sourcetype: cisco:ise:syslog
        host: ise-lab-01
        _raw: "<181>$SYSLOG_TIMESTAMP$ $HOST$ CISE_Failed_Attempts 0000000003 1 0 $ISE_TIMESTAMP$ 0000000003 5400 NOTICE Failed-Attempt: Authentication failed, User-Name=lab_user, Calling-Station-ID=02:00:00:00:00:01, Framed-IP-Address=192.0.2.30, NAS-IP-Address=192.0.2.20, Protocol=Radius, Response={RadiusPacketType=AccessReject;}"
