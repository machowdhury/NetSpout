samples:
- name: cisco-sdwan-aaa-6-notify-mlist-state-to-aaa-client
  description: Real Network Assurance replay for cisco:sdwan:AAA-6-NOTIFY_MLIST_STATE_TO_AAA_CLIENT (catalyst index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: catalyst
      sourcetype: cisco:sdwan:AAA-6-NOTIFY_MLIST_STATE_TO_AAA_CLIENT
      source: udp:5514
      host: 10.201.48.115
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.116 179: *$TS$:  %AAA-6-NOTIFY_MLIST_STATE_TO_AAA_CLIENT: Notifying state of authentication method list  pvt_authen_0 of DOT1X service as DEAD'
    - index: catalyst
      sourcetype: cisco:sdwan:AAA-6-NOTIFY_MLIST_STATE_TO_AAA_CLIENT
      source: udp:5514
      host: 10.201.48.115
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.121 2317: *$TS$:  %AAA-6-NOTIFY_MLIST_STATE_TO_AAA_CLIENT: Notifying state of authentication method list  pvt_authen_0 of DOT1X service as ALIVE'
