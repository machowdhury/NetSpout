samples:
- name: cisco-sdwan-bgp-6-nexthop
  description: Real Network Assurance replay for cisco:sdwan:BGP-6-NEXTHOP (catalyst index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: catalyst
      sourcetype: cisco:sdwan:BGP-6-NEXTHOP
      source: udp:5514
      host: 10.201.48.118
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.118 3181: *$TS$:  %BGP-6-NEXTHOP: Invalid next hop (0.0.0.0) received from 10.201.48.114: martian next hop'
    - index: catalyst
      sourcetype: cisco:sdwan:BGP-6-NEXTHOP
      source: udp:5514
      host: 10.201.48.118
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.119 3177: *$TS$:  %BGP-6-NEXTHOP: Invalid next hop (0.0.0.0) received from 10.201.48.114: martian next hop'
