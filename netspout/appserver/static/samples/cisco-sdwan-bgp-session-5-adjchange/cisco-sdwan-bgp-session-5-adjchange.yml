samples:
- name: cisco-sdwan-bgp-session-5-adjchange
  description: Real Network Assurance replay for cisco:sdwan:BGP_SESSION-5-ADJCHANGE (catalyst index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: catalyst
      sourcetype: cisco:sdwan:BGP_SESSION-5-ADJCHANGE
      source: udp:5514
      host: 10.201.48.115
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.120 3263: *$TS$:  %BGP_SESSION-5-ADJCHANGE: neighbor 10.201.152.1 IPv4 Unicast vpn vrf UBC_TENANT topology base removed from session  Neighbor deleted'
    - index: catalyst
      sourcetype: cisco:sdwan:BGP_SESSION-5-ADJCHANGE
      source: udp:5514
      host: 10.201.48.115
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.121 895: *$TS$:  %BGP_SESSION-5-ADJCHANGE: neighbor 10.201.48.118 L2VPN Evpn topology base removed from session  NSF peer closed the session'
