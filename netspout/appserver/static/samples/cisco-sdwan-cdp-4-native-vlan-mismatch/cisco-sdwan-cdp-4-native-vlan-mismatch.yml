samples:
- name: cisco-sdwan-cdp-4-native-vlan-mismatch
  description: Real Network Assurance replay for cisco:sdwan:CDP-4-NATIVE_VLAN_MISMATCH (catalyst index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: catalyst
      sourcetype: cisco:sdwan:CDP-4-NATIVE_VLAN_MISMATCH
      source: udp:5514
      host: 10.201.48.120
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.120 1044: *$TS$:  %CDP-4-NATIVE_VLAN_MISMATCH: Native VLAN mismatch discovered on GigabitEthernet1/0/4 (1), with switch2 GigabitEthernet0/1 (201).'
    - index: catalyst
      sourcetype: cisco:sdwan:CDP-4-NATIVE_VLAN_MISMATCH
      source: udp:5514
      host: 10.201.48.120
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.120 1058: *$TS$:  %CDP-4-NATIVE_VLAN_MISMATCH: Native VLAN mismatch discovered on GigabitEthernet1/0/4 (1), with multicastswitch GigabitEthernet0/1 (201).'
