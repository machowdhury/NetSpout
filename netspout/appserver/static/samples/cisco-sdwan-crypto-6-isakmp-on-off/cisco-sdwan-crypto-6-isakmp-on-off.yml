samples:
  ### CISCO-SDWAN-CRYPTO-6-ISAKMP-ON-OFF - HEALTHY BASELINE ###
  - name: cisco-sdwan-crypto-6-isakmp-on-off-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: 10.201.50.12
          - weight: 2
            choice: 10.201.50.12-peer
    lines:
      - index: main
        source: udp:5523
        sourcetype: cisco:sdwan:CRYPTO-6-ISAKMP_ON_OFF
        host: $HOST$
        _raw: '$SYSLOG_TIMESTAMP$ $HOST$ 14675: $SYSLOG_TIMESTAMP$.701: %CRYPTO-6-ISAKMP_ON_OFF: ISAKMP is ON'

  ### CISCO-SDWAN-CRYPTO-6-ISAKMP-ON-OFF - DEGRADED / WARNING ###
  - name: cisco-sdwan-crypto-6-isakmp-on-off-degraded
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: 10.201.50.12
    lines:
      - index: main
        source: udp:5523
        sourcetype: cisco:sdwan:CRYPTO-6-ISAKMP_ON_OFF
        host: $HOST$
        _raw: '$SYSLOG_TIMESTAMP$ $HOST$ 14675: $SYSLOG_TIMESTAMP$.701: %CRYPTO-6-ISAKMP_ON_OFF: ISAKMP is ON'

  ### CISCO-SDWAN-CRYPTO-6-ISAKMP-ON-OFF - CRITICAL / FAILURE ###
  - name: cisco-sdwan-crypto-6-isakmp-on-off-failure
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: 10.201.50.12
    lines:
      - index: main
        source: udp:5523
        sourcetype: cisco:sdwan:CRYPTO-6-ISAKMP_ON_OFF
        host: $HOST$
        _raw: '$SYSLOG_TIMESTAMP$ $HOST$ 14675: $SYSLOG_TIMESTAMP$.701: %CRYPTO-6-ISAKMP_ON_OFF: ISAKMP is ON'
