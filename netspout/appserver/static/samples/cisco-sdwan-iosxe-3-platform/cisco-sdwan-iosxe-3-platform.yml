samples:
- name: cisco-sdwan-iosxe-3-platform
  description: Real Network Assurance replay for cisco:sdwan:IOSXE-3-PLATFORM (catalyst index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: catalyst
      sourcetype: cisco:sdwan:IOSXE-3-PLATFORM
      source: udp:5514
      host: 10.201.48.115
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.115 288: *$TS$:  %IOSXE-3-PLATFORM: Switch 1 R0/0: kernel: eth2: mtu greater than device maximum'
    - index: catalyst
      sourcetype: cisco:sdwan:IOSXE-3-PLATFORM
      source: udp:5514
      host: 10.201.48.115
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.119 4342: *$TS$:  %IOSXE-3-PLATFORM: Switch 1 R0/0: kernel: ata1.00: status: { DRDY }'
