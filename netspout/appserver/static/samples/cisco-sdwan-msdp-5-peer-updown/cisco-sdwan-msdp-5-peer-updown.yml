samples:
- name: cisco-sdwan-msdp-5-peer-updown
  description: Real Network Assurance replay for cisco:sdwan:MSDP-5-PEER_UPDOWN (catalyst index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: catalyst
      sourcetype: cisco:sdwan:MSDP-5-PEER_UPDOWN
      source: udp:5514
      host: 10.201.48.118
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.119 4394: *$TS$:  %MSDP-5-PEER_UPDOWN: Session to peer 10.201.151.1 going down'
    - index: catalyst
      sourcetype: cisco:sdwan:MSDP-5-PEER_UPDOWN
      source: udp:5514
      host: 10.201.48.118
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.118 2850: *$TS$:  %MSDP-5-PEER_UPDOWN: Session to peer 10.201.151.2 going up'
