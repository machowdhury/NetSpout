samples:
- name: cisco-sdwan-ospf-5-adjchg
  description: Real Network Assurance replay for cisco:sdwan:OSPF-5-ADJCHG (catalyst index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: catalyst
      sourcetype: cisco:sdwan:OSPF-5-ADJCHG
      source: udp:5514
      host: 10.201.48.115
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.119 4393: *$TS$:  %OSPF-5-ADJCHG: Process 1, Nbr 10.201.48.120 on GigabitEthernet1/0/5 from FULL to DOWN, Neighbor Down: Dead timer expired'
    - index: catalyst
      sourcetype: cisco:sdwan:OSPF-5-ADJCHG
      source: udp:5514
      host: 10.201.48.115
      _time: "$EPOCH$"
      _raw: '$TS$ 10.201.48.118 3342: *$TS$:  %OSPF-5-ADJCHG: Process 1, Nbr 10.201.48.114 on GigabitEthernet1/0/1 from LOADING to FULL, Loading Done'
