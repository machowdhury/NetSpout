samples:
- name: cisco-sdwan-ssetunnels
  description: Real Network Assurance replay for cisco:sdwan:ssetunnels (sdwan index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
