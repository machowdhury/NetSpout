samples:
  ### CISCO-SDWAN-SYSLOG - HEALTHY BASELINE ###
  - name: cisco-sdwan-syslog-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: 10.201.50.12
          - weight: 2
            choice: 10.201.50.12-peer
    lines:
      - index: main
        source: udp:5523
        sourcetype: cisco:sdwan:syslog
        host: $HOST$
        _raw: '$SYSLOG_TIMESTAMP$ $HOST$ 186746: $SYSLOG_TIMESTAMP$.730: %DMI-5-AUTH_PASSED: R0/0: dmiauthd: User ''vmanage-admin'' authenticated successfully from 1.1.1.105:54758  for netconf over ssh. External groups:'

  ### CISCO-SDWAN-SYSLOG - DEGRADED / WARNING ###
  - name: cisco-sdwan-syslog-degraded
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: 10.201.50.12
    lines:
      - index: main
        source: udp:5523
        sourcetype: cisco:sdwan:syslog
        host: $HOST$
        _raw: '$SYSLOG_TIMESTAMP$ $HOST$ 186746: $SYSLOG_TIMESTAMP$.730: %DMI-5-AUTH_PASSED: R0/0: dmiauthd: User ''vmanage-admin'' authenticated successfully from 1.1.1.105:54758  for netconf over ssh. External groups:'

  ### CISCO-SDWAN-SYSLOG - CRITICAL / FAILURE ###
  - name: cisco-sdwan-syslog-failure
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: 10.201.50.12
    lines:
      - index: main
        source: udp:5523
        sourcetype: cisco:sdwan:syslog
        host: $HOST$
        _raw: '$SYSLOG_TIMESTAMP$ $HOST$ 186746: $SYSLOG_TIMESTAMP$.730: %DMI-5-AUTH_PASSED: R0/0: dmiauthd: User ''vmanage-admin'' authenticated successfully from 1.1.1.105:54758  for netconf over ssh. External groups:'
