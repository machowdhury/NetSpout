samples:
- name: cisco-sdwan-utd-logs
  description: Real Network Assurance replay for cisco:sdwan:utd:logs (sdwan index)
  interval: 60
  count: 2
  randomizeEvents: false
  tokens:
    - name: TS
      format: template
      type: gotimestamp
      replacement: "Jan 02 15:04:05"
    - name: GOTS
      format: template
      type: gotimestamp
      replacement: "2006-01-02T15:04:05Z"
    - name: EPOCH
      format: template
      type: epochtimestamp
    - name: EPOCH_MS
      format: template
      type: javatimestamp
  lines:
    - index: sdwan
      sourcetype: cisco:sdwan:utd:logs
      source: udp:514
      host: 192.168.128.103
      _time: "$EPOCH$"
      _raw: '$TS$ 192.168.128.132 2026/03/01-00:00:00.307403 UTC [**] [Hostname: c8kv-site-3000-gw1] [**] [System_IP: 172.100.1.5] [**] [Instance_ID: 1] [**] Drop [**] UTD WebFilter Category/Reputation [**] [URL: www.tekdefense.com/downloads/malware-samples/1.exe.zip] ** [Category: Malware Sites] ** [Reputation: 10] [POLICY: BR-TYPE2-AIP] {TCP} 10.33.35.101:55924 -> 198.185.159.160:80'
    - index: sdwan
      sourcetype: cisco:sdwan:utd:logs
      source: udp:514
      host: 192.168.128.103
      _time: "$EPOCH$"
      _raw: '$TS$ 192.168.128.218 2026/03/26-16:40:37.124861 UTC [**] [Hostname: c4451x-site5000] [**] [System_IP: 172.50.1.1] [**] [Instance_ID: 1] [**] Drop [**] [1:25659:6] MALWARE-CNC User-Agent known malicious user agent - spam_bot [**] [Classification: A Network Trojan was Detected] [Priority: 1] [POLICY: BR-TYPE2-AIP] {TCP} 10.50.50.110:45764 -> 150.171.27.10:80'
