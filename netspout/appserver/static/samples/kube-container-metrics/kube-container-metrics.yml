samples:
  ### KUBE-CONTAINER-METRICS - HEALTHY BASELINE ###
  - name: kube-container-metrics-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: maple-splunk-vm4-hf.maple.ciscolabs.com
          - weight: 2
            choice: maple-splunk-vm4-hf.maple.ciscolabs.com-peer
    lines:
      - index: em_logs
        source: /var/log/pods/sc4snmp_snmp-mongodb-86684c54d5-6zn2p_8dd64216-3abd-4f6a-a4ed-a7ad1135c723/metrics/12.log
        sourcetype: kube:container:metrics
        host: $HOST$
        _raw: 'level=info ts=$ISO_TIMESTAMP$ caller=tls_config.go:316 msg="TLS is disabled." http2=false address=[::]:9216'

  ### KUBE-CONTAINER-METRICS - DEGRADED / WARNING ###
