      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: maple-splunk-vm4-hf.maple.ciscolabs.com
    lines:
      - index: em_logs
        source: /var/log/pods/metallb-system_speaker-c4pl4_21ffe2d3-0063-4cf2-9f16-fca58bcdb3c4/speaker/165.log
        sourcetype: kube:container:speaker
        host: $HOST$
        _raw: '{"caller":"layer2_status_controller.go:111","controller":"Layer2StatusReconciler","end reconcile":"sc4snmp/snmp-splunk-connect-for-snmp-trap","level":"info","ts":"$ISO_TIMESTAMP$"}'
