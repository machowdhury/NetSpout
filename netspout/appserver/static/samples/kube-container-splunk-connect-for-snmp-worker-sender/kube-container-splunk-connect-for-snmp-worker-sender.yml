    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: maple-splunk-vm4-hf.maple.ciscolabs.com
    lines:
      - index: em_logs
        source: /var/log/pods/sc4snmp_snmp-splunk-connect-for-snmp-worker-sender-b446c488b-kmfqf_6ea8e039-eea6-4bf5-b6b1-fc74326204d5/splunk-connect-for-snmp-worker-sender/12.log
        sourcetype: kube:container:splunk-connect-for-snmp-worker-sender
        host: $HOST$
        _raw: '[2026-09-02 10:14:39,562: INFO/MainProcess] celery@snmp-splunk-connect-for-snmp-worker-sender-b446c488b-kmfqf ready.'

  ### KUBE-CONTAINER-SPLUNK-CONNECT-FOR-SNMP-WORKER-SENDER - CRITICAL / FAILURE ###
  - name: kube-container-splunk-connect-for-snmp-worker-sender-failure
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: maple-splunk-vm4-hf.maple.ciscolabs.com
    lines:
      - index: em_logs
        source: /var/log/pods/sc4snmp_snmp-splunk-connect-for-snmp-worker-sender-b446c488b-kmfqf_6ea8e039-eea6-4bf5-b6b1-fc74326204d5/splunk-connect-for-snmp-worker-sender/12.log
        sourcetype: kube:container:splunk-connect-for-snmp-worker-sender
        host: $HOST$
