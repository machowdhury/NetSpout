      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: maple-splunk-vm4-hf.maple.ciscolabs.com
    lines:
      - index: em_logs
        source: /var/log/pods/sc4snmp_snmp-splunk-connect-for-snmp-worker-trap-56dd75bf88-49dkk_1654efb9-9e12-4b62-87c2-1e6f0f47ec34/splunk-connect-for-snmp-worker-trap/12.log
        sourcetype: kube:container:splunk-connect-for-snmp-worker-trap
        host: $HOST$
