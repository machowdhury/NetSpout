        sourcetype: kube:container:upgrade-ipam
        host: $HOST$
        _raw: '2026-09-02 10:13:21.421 [INFO][1] ipam/ipam_plugin.go 100: migration from host-local to calico-ipam complete node="maple-splunk-vm4-hf"'

  ### KUBE-CONTAINER-UPGRADE-IPAM - CRITICAL / FAILURE ###
