  ### NUTANIXPC-ALERTS - HEALTHY BASELINE ###
  - name: nutanixpc-alerts-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: https://10.0.4.120:9440/api/monitoring/v4.0/serviceability/alerts
          - weight: 2
            choice: https://10.0.4.120:9440/api/monitoring/v4.0/serviceability/alerts-peer
