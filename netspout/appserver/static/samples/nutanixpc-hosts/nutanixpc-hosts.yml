samples:
  ### NUTANIXPC-HOSTS - HEALTHY BASELINE ###
  - name: nutanixpc-hosts-baseline
    interval: 30
    count: 3
    randomizeEvents: true
    tokens:
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: HOST
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: https://10.0.4.120:9440/api/clustermgmt/v4.0/config/hosts
          - weight: 2
            choice: https://10.0.4.120:9440/api/clustermgmt/v4.0/config/hosts-peer
    lines:
      - index: nutanixpc
        source: nutanixpc:pcdiscovery
        sourcetype: nutanixpc_hosts
        host: $HOST$
