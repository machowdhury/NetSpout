    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%3NZ"
    lines:
      - index: netops_logs
        source: syslog:udp:514
        sourcetype: sophos:central:cef
        host: "sensor-01.acme.corp"
