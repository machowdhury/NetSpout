      # Resolution 2: Branch 1 SD-WAN Path Failover to MPLS / Core Transport
      - index: sdwan
        source: cisco_catalyst_sdwan_site_and_tunnel_health:sitehealth:NetOps_SDWAN
        sourcetype: cisco:sdwan:sitehealth
        host: C8K-SDWAN-Site325-01
        _time: "$EPOCH$"
        _raw: '{"site_id": "325", "site_name": "Branch 1 (Site 325)", "as_number": 65526, "edge_device": "C8K-SDWAN-Site325-01", "site_health": "good", "site_health_score": 8.0, "devices_health_score": 8.0, "tunnels_health_score": 8.0, "loss_percentage": 0.0, "latency": 16.4, "remediation": "Auto-failover to MPLS Core transport link established", "status": "connected", "lastUpdated": $EPOCH_MS$}'

      # Resolution 3: SRv6 Zombie SIDs Purged & Hardware Allocation Back to Normal
