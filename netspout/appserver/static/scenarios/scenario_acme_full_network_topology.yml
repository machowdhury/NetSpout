  ### ========================================================================= ###
  ### STAGE 3: SELF-HEALING & RESOLUTION                                        ###
  ### Subnets restored, optical bypass active, TI-LFA convergence verified       ###
  ### ========================================================================= ###
  - name: acme-topology-stage3-remediated
    interval: 30
    count: 2
    randomizeEvents: true
    tokens:
      - name: ISO_TS
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
      - name: SYSLOG_TS
        format: template
        type: timestamp
        replacement: "%b %d %H:%M:%S"
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: EPOCH_MS
        format: template
        type: javatimestamp
    lines:
      # Resolution 1: ACI Subnet 10.20.104.200/24 Re-associated with L3Out
      - index: main
        source: cisco:dc:aci:events
        sourcetype: cisco:dc:aci:events
        host: apic-inb.maple.ciscolabs.com
