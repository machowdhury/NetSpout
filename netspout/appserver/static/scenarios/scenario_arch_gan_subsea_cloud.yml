scenario_id: "ARCH-GAN-11"
name: "GAN (Global Area Network) - Worldwide Multi-Cloud & Subsea Cable Transit"
description: "Trans-continental global network connecting AWS Direct Connect, Azure ExpressRoute, and subsea cable landing stations."

test_oracle:
  expected_root_cause: "Subsea optical transponder chromatic dispersion surge triggering automatic protection switch"
  symptomatic_systems: ["Campus Core", "Edge Gateway", "Aggregation Spine"]
  independent_verifier: "Splunk search validation on index idx_network_ops and sourcetype cisco:ios:syslog"

general:
  workerThreads: 2
  globalInterval: 1
  rotInterval: 1
  output:
    bufferBytes: 4096
    outputter: splunkhec
    outputTemplate: splunkhec
    endpoints:
      - https://127.0.0.1:8888/services/collector
    splunkHECToken: 00000000-0000-0000-0000-000000000000

samples:
  - name: arch-gan-11-telemetry
    interval: 2
    count: 1
    randomizeEvents: true
    tokens:
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
    lines:
      - index: idx_network_ops
        source: scenario_stream
        sourcetype: cisco:ios:syslog
        host: gan-subsea-landing-ny.corp.internal
        _raw: '%OPTICAL-4-BER_DEGRADE: Transceiver Subsea-Lambda-01 post-FEC BER exceeds 2.4e-4. Automatic protection switch to secondary trans-pacific path executed.'
