scenario_id: "ARCH-LAN-02"
name: "LAN (Local Area Network) - Enterprise Campus Switching & 802.1Q Segments"
description: "High-density campus LAN with Cisco Catalyst 9300/9500 switches, 802.1Q trunking, DHCP snooping, and ARP inspection."

test_oracle:
  expected_root_cause: "Rogue DHCP offer intercepted by DHCP snooping on untrusted port Gi1/0/18"
  symptomatic_systems: ["Campus Core", "Edge Gateway", "Aggregation Spine"]
  independent_verifier: "Splunk search validation on index idx_network_ops and sourcetype cisco:catalyst:security:events"

general:
  workerThreads: 2
  globalInterval: 1
  rotInterval: 1
  output:
    bufferBytes: 4096
    outputter: splunkhec
    outputTemplate: splunkhec
    endpoints:
      - https://127.0.0.1:8888/services/collector
    splunkHECToken: 00000000-0000-0000-0000-000000000000

samples:
  - name: arch-lan-02-telemetry
    interval: 2
    count: 1
    randomizeEvents: true
    tokens:
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
    lines:
      - index: idx_network_ops
        source: scenario_stream
        sourcetype: cisco:catalyst:security:events
        host: cat9300-access-sw01.campus.internal
        _raw: '%DHCP_SNOOPING-5-DHCP_OFFER_DROPPED: DHCP offer dropped on untrusted port GigabitEthernet1/0/18 from server 192.168.100.99, MAC 00:1a:2b:88:99:cc'
