scenario_id: "ARCH-PAN-01"
name: "PAN (Personal Area Network) - IoT Sensor Cluster & Bluetooth Mesh"
description: "Short-range IoT sensor mesh monitoring environmental conditions, temperature, humidity, and Bluetooth LE beacon telemetry."

test_oracle:
  expected_root_cause: "IoT sensor environmental threshold breach and low battery telemetry alert"
  symptomatic_systems: ["Campus Core", "Edge Gateway", "Aggregation Spine"]
  independent_verifier: "Splunk search validation on index idx_network_ops and sourcetype pan:ble:iot:sensor"

general:
  workerThreads: 2
  globalInterval: 1
  rotInterval: 1
  output:
    bufferBytes: 4096
    outputter: splunkhec
    outputTemplate: splunkhec
    endpoints:
      - https://127.0.0.1:8888/services/collector
    splunkHECToken: 00000000-0000-0000-0000-000000000000

samples:
  - name: arch-pan-01-telemetry
    interval: 2
    count: 1
    randomizeEvents: true
    tokens:
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: ISO_TIMESTAMP
        format: template
        type: timestamp
        replacement: "%Y-%m-%dT%H:%M:%S.%fZ"
    lines:
      - index: idx_network_ops
        source: scenario_stream
        sourcetype: pan:ble:iot:sensor
        host: iot-pan-gateway01.corp.internal
        _raw: '{"timestamp":"$ISO_TIMESTAMP$","pan_type":"BLE_MESH_ZIGBEE","gateway":"iot-pan-gateway01","sensor_id":"temp-sensor-rack-04","temperature_celsius":26.8,"humidity_pct":44.2,"battery_pct":88,"rssi_dbm":-62,"status":"HEALTHY","mesh_hops":2}'
