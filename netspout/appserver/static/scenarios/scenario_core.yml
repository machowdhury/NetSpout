samples:
  ### STAGE 1: CORE HEALTHY BASELINE (METRICS & ACI) ###
  - name: core-healthy-baseline
    interval: 30
    count: 5
    randomizeEvents: true
    tokens:
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: BYTES_RCVD
        format: template
        type: random
        replacement: int
        lower: 12000000
        upper: 28000000
      - name: BYTES_SENT
        format: template
        type: random
        replacement: int
        lower: 11000000
        upper: 26000000
      - name: ROUTER
        format: template
        type: weightedChoice
        weightedChoice:
          - weight: 3
            choice: "10.0.255.171"
          - weight: 3
            choice: "10.0.255.172"
          - weight: 2
            choice: "R1"
          - weight: 2
            choice: "R2"
    lines:
      - index: cisco_metrics
        source: $ROUTER$
        sourcetype: httpevent
        host: "34.236.151.135:8088"
        _raw: '{"time": $EPOCH$, "event": "metric", "source": "$ROUTER$", "sourcetype": "httpevent", "host": "34.236.151.135:8088", "index": "cisco_metrics", "fields": {"metric_name:interface_generic_counters.bandwidth": 40000000, "metric_name:interface_generic_counters.bytes_received": $BYTES_RCVD$, "metric_name:interface_generic_counters.bytes_sent": $BYTES_SENT$, "metric_name:interface_generic_counters.packets_received": 18500, "metric_name:interface_generic_counters.packets_sent": 17200, "metric_name:interface_generic_counters.input_drops": 0, "metric_name:interface_generic_counters.output_drops": 0, "metric_name:interface_generic_counters.input_errors": 0, "metric_name:interface_generic_counters.output_errors": 0, "interface_name": "FortyGigE0/0/1/1", "path": "Cisco-IOS-XR-infra-statsd-oper:/infra-statistics/interfaces/interface/generic-counters"}}'
      - index: cisco_metrics
        source: $ROUTER$
        sourcetype: httpevent
        host: "34.236.151.135:8088"
        _raw: '{"time": $EPOCH$, "event": "metric", "source": "$ROUTER$", "sourcetype": "httpevent", "host": "34.236.151.135:8088", "index": "cisco_metrics", "fields": {"metric_name:bgp_status.peer_as": 65013, "metric_name:bgp_status.session_state": 5, "metric_name:Cisco-IOS-XR-ipv4-bgp-oper:bgp/instances/instance/instance-active/vrfs/vrf/afs/af/neighbor-af-table/neighbor.af_data/prefixes_accepted": 8, "metric_name:Cisco-IOS-XR-wdsysmon-fd-oper:system-monitoring/cpu-utilization.total_cpu_five_minute": 2, "neighbor_address": "10.30.4.137", "af_name": "ipv4-unicast"}}'
      - index: main
        source: cisco:dc:aci:health
        sourcetype: cisco:dc:aci:health
        host: apic-dc01.corp.local
        _raw: '{"component": "fabricHealthTotal", "dn": "topology/health", "cur": 100, "aseverity": "cleared", "Role": "fabric"}'

  ### STAGE 2: FIBER TRANSCEIVER DEGRADATION (PACKET DROPS SURGE) ###
  - name: core-transceiver-congestion
    interval: 20
    count: 4
    randomizeEvents: true
    tokens:
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: INPUT_DROPS
        format: template
        type: random
        replacement: int
        lower: 1500
        upper: 4200
      - name: INPUT_ERRORS
        format: template
        type: random
        replacement: int
        lower: 180
        upper: 520
      - name: CPU_SPIKE
        format: template
        type: random
        replacement: int
        lower: 35
        upper: 60
    lines:
      - index: cisco_metrics
        source: "10.0.255.171"
        sourcetype: httpevent
        host: "34.236.151.135:8088"
        _raw: '{"time": $EPOCH$, "event": "metric", "source": "10.0.255.171", "sourcetype": "httpevent", "host": "34.236.151.135:8088", "index": "cisco_metrics", "fields": {"metric_name:interface_generic_counters.bandwidth": 40000000, "metric_name:interface_generic_counters.bytes_received": 3500000, "metric_name:interface_generic_counters.bytes_sent": 3200000, "metric_name:interface_generic_counters.packets_received": 5200, "metric_name:interface_generic_counters.packets_sent": 4800, "metric_name:interface_generic_counters.input_drops": $INPUT_DROPS$, "metric_name:interface_generic_counters.output_drops": $INPUT_DROPS$, "metric_name:interface_generic_counters.input_errors": $INPUT_ERRORS$, "metric_name:interface_generic_counters.output_errors": 120, "metric_name:Cisco-IOS-XR-wdsysmon-fd-oper:system-monitoring/cpu-utilization.total_cpu_five_minute": $CPU_SPIKE$, "interface_name": "FortyGigE0/0/1/1", "path": "Cisco-IOS-XR-infra-statsd-oper:/infra-statistics/interfaces/interface/generic-counters"}}'
      - index: main
        source: cisco:dc:aci:health
        sourcetype: cisco:dc:aci:health
        host: apic-dc01.corp.local
        _raw: '{"component": "fabricNode", "dn": "topology/pod-1/node-101", "cur": 78, "aseverity": "warning", "Role": "leaf"}'

  ### STAGE 3: CORE BACKBONE COLLAPSE (LINK DOWN, BGP PEER DEAD, ACI CRITICAL) ###
  - name: core-catastrophic-failure
    interval: 15
    count: 5
    randomizeEvents: true
    tokens:
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: SURGE_DROPS
        format: template
        type: random
        replacement: int
        lower: 12000
        upper: 22000
    lines:
      - index: cisco_metrics
        source: "10.0.255.171"
        sourcetype: httpevent
        host: "34.236.151.135:8088"
        _raw: '{"time": $EPOCH$, "event": "metric", "source": "10.0.255.171", "sourcetype": "httpevent", "host": "34.236.151.135:8088", "index": "cisco_metrics", "fields": {"metric_name:interface_generic_counters.bandwidth": 40000000, "metric_name:interface_generic_counters.bytes_received": 0, "metric_name:interface_generic_counters.bytes_sent": 0, "metric_name:interface_generic_counters.packets_received": 0, "metric_name:interface_generic_counters.packets_sent": 0, "metric_name:interface_generic_counters.input_drops": $SURGE_DROPS$, "metric_name:interface_generic_counters.output_drops": $SURGE_DROPS$, "metric_name:interface_generic_counters.input_errors": 980, "metric_name:interface_generic_counters.output_errors": 450, "interface_name": "FortyGigE0/0/1/1", "path": "Cisco-IOS-XR-infra-statsd-oper:/infra-statistics/interfaces/interface/generic-counters"}}'
      - index: cisco_metrics
        source: "10.0.255.171"
        sourcetype: httpevent
        host: "34.236.151.135:8088"
        _raw: '{"time": $EPOCH$, "event": "metric", "source": "10.0.255.171", "sourcetype": "httpevent", "host": "34.236.151.135:8088", "index": "cisco_metrics", "fields": {"metric_name:bgp_status.peer_as": 65013, "metric_name:bgp_status.session_state": 0, "metric_name:Cisco-IOS-XR-ipv4-bgp-oper:bgp/instances/instance/instance-active/vrfs/vrf/afs/af/neighbor-af-table/neighbor.af_data/prefixes_accepted": 0, "metric_name:Cisco-IOS-XR-ipv4-bgp-oper:bgp/instances/instance/instance-active/default-vrf/process-info.performance_statistics/global/ipv4rib_server/rib_connection_down_count": 3, "metric_name:Cisco-IOS-XR-wdsysmon-fd-oper:system-monitoring/cpu-utilization.total_cpu_five_minute": 95, "neighbor_address": "10.30.4.137", "af_name": "ipv4-unicast"}}'
      - index: main
        source: cisco:dc:aci:health
        sourcetype: cisco:dc:aci:health
        host: apic-dc01.corp.local
        _raw: '{"component": "fabricNode", "dn": "topology/pod-1/node-101", "cur": 52, "aseverity": "critical", "Role": "leaf"}'
      - index: main
        source: cisco:dc:aci:health
        sourcetype: cisco:dc:aci:health
        host: apic-dc01.corp.local
        _raw: '{"component": "fabricHealthTotal", "dn": "topology/health", "cur": 65, "aseverity": "critical", "Role": "fabric"}'

  ### STAGE 4: CORE REROUTE & CONVERGENCE ###
  - name: core-convergence-restoration
    interval: 30
    count: 4
    randomizeEvents: true
    tokens:
      - name: EPOCH
        format: template
        type: epochtimestamp
      - name: BYTES_RCVD
        format: template
        type: random
        replacement: int
        lower: 15000000
        upper: 30000000
    lines:
      - index: cisco_metrics
        source: "10.0.255.172"
        sourcetype: httpevent
        host: "34.236.151.135:8088"
        _raw: '{"time": $EPOCH$, "event": "metric", "source": "10.0.255.172", "sourcetype": "httpevent", "host": "34.236.151.135:8088", "index": "cisco_metrics", "fields": {"metric_name:interface_generic_counters.bandwidth": 40000000, "metric_name:interface_generic_counters.bytes_received": $BYTES_RCVD$, "metric_name:interface_generic_counters.bytes_sent": $BYTES_RCVD$, "metric_name:interface_generic_counters.packets_received": 19500, "metric_name:interface_generic_counters.packets_sent": 18200, "metric_name:interface_generic_counters.input_drops": 0, "metric_name:interface_generic_counters.output_drops": 0, "interface_name": "FortyGigE0/0/1/0", "path": "Cisco-IOS-XR-infra-statsd-oper:/infra-statistics/interfaces/interface/generic-counters"}}'
      - index: cisco_metrics
        source: "10.0.255.172"
        sourcetype: httpevent
        host: "34.236.151.135:8088"
        _raw: '{"time": $EPOCH$, "event": "metric", "source": "10.0.255.172", "sourcetype": "httpevent", "host": "34.236.151.135:8088", "index": "cisco_metrics", "fields": {"metric_name:bgp_status.peer_as": 65014, "metric_name:bgp_status.session_state": 5, "metric_name:Cisco-IOS-XR-ipv4-bgp-oper:bgp/instances/instance/instance-active/vrfs/vrf/afs/af/neighbor-af-table/neighbor.af_data/prefixes_accepted": 12, "metric_name:Cisco-IOS-XR-wdsysmon-fd-oper:system-monitoring/cpu-utilization.total_cpu_five_minute": 6, "neighbor_address": "10.30.4.138", "af_name": "ipv4-unicast"}}'
      - index: main
        source: cisco:dc:aci:health
        sourcetype: cisco:dc:aci:health
        host: apic-dc01.corp.local
        _raw: '{"component": "fabricHealthTotal", "dn": "topology/health", "cur": 98, "aseverity": "cleared", "Role": "fabric"}'
