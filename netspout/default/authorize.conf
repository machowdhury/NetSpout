[capability::netspout_admin]

[capability::netspout_view]

# read-only use: the `user` role, inherited by power and admin
[role_user]
netspout_view = enabled

# run, stop and configure: admin as before, plus sc_admin and power (the roles the gateway allowed before capabilities)
[role_admin]
netspout_admin = enabled

[role_sc_admin]
netspout_admin = enabled

[role_power]
netspout_admin = enabled
