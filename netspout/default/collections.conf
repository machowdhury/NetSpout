# NetSpout KV Store Collections for Topology Persistence & State Management

[netspout_topologies]
enforceTypes = true
field.name = string
field.description = string
field.ecosystem = string
field.updated_at = time
field.topology_json = string
replicate = true

[netspout_nodes]
enforceTypes = true
field.node_id = string
field.name = string
field.type = string
field.vendor = string
field.ip_address = string
field.x = number
field.y = number
field.power_state = string
field.status = string
field.yang_state = string
replicate = true

[netspout_links]
enforceTypes = true
field.link_id = string
field.source = string
field.target = string
field.media_type = string
field.speed_mbps = number
field.status = string
field.carrier_transitions = number
replicate = true

[netspout_faults]
enforceTypes = true
field.fault_id = string
field.scenario_type = string
field.target_id = string
field.status = string
field.timestamp = time
field.cascade_events = string
replicate = true

[netspout_config]
enforceTypes = true
field.hec_url = string
field.hec_token = string
field.metric_index = string
field.event_index = string
field.syslog_host = string
field.syslog_port = number
field.syslog_protocol = string
replicate = true
