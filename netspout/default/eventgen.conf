# NetSpout Automated Eventgen Configuration
# Generates continuous realistic telemetry across all Cisco sourcetypes

[cisco_dc_nexus9k.sample]
interval = 15
earliest = -15m
latest = now
count = 3
sourcetype = cisco:dc:nexus9k
index = idx_network_ops
source = netspout:eventgen:cisco_dc_nexus9k
host = netspout-core-cisco_dc_nex.internal

## Auto Timestamp Replacements
token.0.token = \d{4}-\d{2}-\d{2}[T\s]\d{2}:\d{2}:\d{2}(?:\.\d{3,6})?(?:Z|[+-]\d{2}:?\d{2})?
token.0.replacementType = timestamp
token.0.replacement = %Y-%m-%dT%H:%M:%S%z

token.1.token = (?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}
token.1.replacementType = timestamp
token.1.replacement = %b %d %H:%M:%S

token.2.token = \b17\d{8,9}\b
token.2.replacementType = timestamp
token.2.replacement = %s


