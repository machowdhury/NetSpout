[netspout_streamer://default]
disabled = 1
interval = 5
ecosystem_mode = mixed_vendor
scenario = mixed_edge_breach
target_hec_url = https://127.0.0.1:8088/services/collector
metric_index = cisco_mdt_metrics
event_index = idx_network_ops

# Existing-Splunk installations do not create HEC tokens, indexes, or network
# listeners implicitly. Administrators configure authorized inputs in local/
# through supported Splunk mechanisms; the Setup Wizard then validates them.



# Enable only after configuring an existing, authorized tcpout group in local/.
# Set _TCP_ROUTING in this app's local/inputs.conf; never change customer outputs.
[pulseforge_spool://native]
disabled = 1
interval = 5
spool_mode = native
python.version = python3
