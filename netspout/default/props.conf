[cisco:sfw:estreamer]
KV_MODE = json
EVAL-signature_id = coalesce(signature_id, SignatureID)
EVAL-signature = coalesce(signature, IntrusionRuleMessage)
EVAL-src = coalesce(src, InitiatorIP)
EVAL-dest = coalesce(dest, ResponderIP)
EVAL-dest_port = coalesce(dest_port, ResponderPort)
EVAL-rule = coalesce(rule, FirewallRule)
EVAL-transport = coalesce(transport, Protocol)
EVAL-app = coalesce(app, Application)

# NetFlow/IPFIX: decoded GoFlow2 records (source goflow2:*) and NetSpout normalized flow events (source netspout:netflow:normalized) share this sourcetype.
# CIM Network Traffic names are computed here at search time; nothing in the stored event claims to be CIM. `action` and `direction` are deliberately NOT set:
# a flow record does not say whether traffic was allowed or blocked, and these records are unidirectional.
# cisco:ios:ipfix is not a catalog sourcetype; the same settings let a run use it when requested (see docs/guides/12_NETFLOW_IPFIX_SOLUTION.md).
[netflow:collector]
KV_MODE = json
EVAL-src = coalesce(src_ip, src_addr)
EVAL-dest = coalesce(dest_ip, dst_addr)
EVAL-dest_port = coalesce(dest_port, dst_port)
EVAL-transport = coalesce(protocol, lower(proto))
EVAL-vendor_product = "NetFlow/IPFIX"

[cisco:ios:ipfix]
KV_MODE = json
EVAL-src = coalesce(src_ip, src_addr)
EVAL-dest = coalesce(dest_ip, dst_addr)
EVAL-dest_port = coalesce(dest_port, dst_port)
EVAL-transport = coalesce(protocol, lower(proto))
EVAL-vendor_product = "NetFlow/IPFIX"
