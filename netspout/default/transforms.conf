[netspout_topologies_lookup]
external_type = kvstore
collection = netspout_topologies
fields_list = _key, name, description, ecosystem, updated_at, topology_json

[netspout_nodes_lookup]
external_type = kvstore
collection = netspout_nodes
fields_list = _key, node_id, name, type, vendor, ip_address, x, y, power_state, status, yang_state

[netspout_links_lookup]
external_type = kvstore
collection = netspout_links
fields_list = _key, link_id, source, target, media_type, speed_mbps, status, carrier_transitions

[netspout_faults_lookup]
external_type = kvstore
collection = netspout_faults
fields_list = _key, fault_id, scenario_type, target_id, status, timestamp, cascade_events
