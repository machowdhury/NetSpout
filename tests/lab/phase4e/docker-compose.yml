# Dedicated, isolated Splunk Enterprise lab for Phase 4E live acceptance.
# Credentials come from .env.lab (git-ignored, generated by lab.sh). Host ports are loopback-only.
name: netspout-phase4e
services:
  splunk:
    image: splunk/splunk:10.2
    platform: linux/amd64
    container_name: netspout_phase4e_splunk
    hostname: netspout-phase4e
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${LAB_SPLUNK_PASSWORD:?run lab.sh up}
      SPLUNK_HEC_TOKEN: ${LAB_HEC_TOKEN:?run lab.sh up}
    ports:
      - "127.0.0.1:${LAB_WEB_PORT:-18000}:8000"
      - "127.0.0.1:${LAB_MGMT_PORT:-18191}:8089"
      - "127.0.0.1:${LAB_HEC_PORT:-18088}:8088"
    volumes:
      - netspout_phase4e_splunk_var:/opt/splunk/var
      - netspout_phase4e_splunk_etc:/opt/splunk/etc
    networks: [netspout_phase4e_net]
networks:
  netspout_phase4e_net:
    name: netspout_phase4e_net
volumes:
  netspout_phase4e_splunk_var:
    name: netspout_phase4e_splunk_var
  netspout_phase4e_splunk_etc:
    name: netspout_phase4e_splunk_etc
