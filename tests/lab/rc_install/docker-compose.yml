# Release-candidate install lab: a FRESH Splunk Enterprise (nothing pre-installed) plus the PulseForge engine built from the candidate's own pulseforge-engine.tar.gz.
# Isolated from every other lab and from the demo: own network, own volumes, loopback-only ports 39000/39191/39088/38081. Credentials come from .env.lab (git-ignored, generated by lab.sh).
# The app (netspout.spl) is installed into this Splunk from the candidate with scripts/phase10_rc_install.py; the gateway reaches the engine at http://engine:8081 on the private network.
name: netspout-rc
services:
  engine:
    build:
      context: ${RC_DIR:?run lab.sh up RC_DIR}
      dockerfile_inline: |
        FROM python:3.13-slim
        COPY pulseforge-engine.tar.gz /tmp/
        RUN mkdir -p /opt && tar xzf /tmp/pulseforge-engine.tar.gz -C /opt && rm /tmp/pulseforge-engine.tar.gz \
         && python -m venv /opt/pulseforge-engine/venv && /opt/pulseforge-engine/venv/bin/pip install -q --no-cache-dir -r /opt/pulseforge-engine/backend/requirements.txt
        ENV PULSEFORGE_ENGINE_HOST=0.0.0.0 PULSEFORGE_ENGINE_PORT=8081 PULSEFORGE_STATE_DIR=/var/lib/pulseforge
        CMD ["/opt/pulseforge-engine/deploy/engine/pulseforge-engine"]
    container_name: netspout_rc_engine
    ports:
      - "127.0.0.1:${RC_ENGINE_PORT:-38081}:8081"
      - "127.0.0.1:39990:39990"   # recording tap, run INSIDE the engine container so the engine reaches it on its own loopback (the product refuses plain HTTP anywhere else)
    volumes:
      - netspout_rc_engine_state:/var/lib/pulseforge
    networks: [netspout_rc_net]
  splunk:
    image: splunk/splunk:10.2
    platform: linux/amd64
    container_name: netspout_rc_splunk
    hostname: netspout-rc
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${LAB_SPLUNK_PASSWORD:?run lab.sh up}
      SPLUNK_HEC_TOKEN: ${LAB_HEC_TOKEN:?run lab.sh up}
      NETSPOUT_BACKEND_URL: http://engine:8081
    ports:
      - "127.0.0.1:${LAB_WEB_PORT:-39000}:8000"
      - "127.0.0.1:${LAB_MGMT_PORT:-39191}:8089"
      - "127.0.0.1:${LAB_HEC_PORT:-39088}:8088"
    volumes:
      - netspout_rc_splunk_var:/opt/splunk/var
      - netspout_rc_splunk_etc:/opt/splunk/etc
    depends_on: [engine]
    networks: [netspout_rc_net]
networks:
  netspout_rc_net:
    name: netspout_rc_net
volumes:
  netspout_rc_engine_state:
    name: netspout_rc_engine_state
  netspout_rc_splunk_var:
    name: netspout_rc_splunk_var
  netspout_rc_splunk_etc:
    name: netspout_rc_splunk_etc
