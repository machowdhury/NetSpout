# Dedicated, isolated Splunk Enterprise lab for vendor-TA parsing validation (installs real add-ons; never the demo lab).
# Credentials come from .env.lab (git-ignored, generated by lab.sh). Host ports are loopback-only.
name: netspout-tavalidation
services:
  splunk:
    image: splunk/splunk:10.2
    platform: linux/amd64
    container_name: netspout_tavalidation_splunk
    hostname: netspout-tavalidation
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${LAB_SPLUNK_PASSWORD:?run lab.sh up}
      SPLUNK_HEC_TOKEN: ${LAB_HEC_TOKEN:?run lab.sh up}
    ports:
      - "127.0.0.1:${LAB_WEB_PORT:-19000}:8000"
      - "127.0.0.1:${LAB_MGMT_PORT:-19191}:8089"
      - "127.0.0.1:${LAB_HEC_PORT:-19088}:8088"
    volumes:
      - netspout_tavalidation_splunk_var:/opt/splunk/var
      - netspout_tavalidation_splunk_etc:/opt/splunk/etc
    networks: [netspout_tavalidation_net]
networks:
  netspout_tavalidation_net:
    name: netspout_tavalidation_net
volumes:
  netspout_tavalidation_splunk_var:
    name: netspout_tavalidation_splunk_var
  netspout_tavalidation_splunk_etc:
    name: netspout_tavalidation_splunk_etc
